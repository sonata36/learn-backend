spring.application.name=learn-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studio_order?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
app.console.enabled=${APP_CONSOLE_ENABLED:false}
mybatis.configuration.map-underscore-to-camel-case=true
app.datasource.initial-size=1
app.datasource.min-idle=1
app.datasource.max-active=10
app.datasource.max-wait=30000
