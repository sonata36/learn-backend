services:
  mysql:
    image: mysql:8.0.36
    container_name: learn-backend-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456      # 仅本地开发用
      MYSQL_DATABASE: learn_backend
      MYSQL_USER: app
      MYSQL_PASSWORD: app123456
      TZ: Asia/Shanghai
    ports:
      # 说明：本机 3306 已被本地安装的 MySQL 服务占用，故宿主机改用 3307。
      # 若你的机器 3306 空闲，可改回 "3306:3306"，并同步修改 application.yml 的 url。
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
